apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-ci-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-ci-demo
  template:
    metadata:
      labels:
        app: jenkins-ci-demo
    spec:
      containers:
      - name: app
        image: sheharzad/jenkins-ci-demo:28
        imagePullPolicy: Always
        ports:
        - containerPort: 3000